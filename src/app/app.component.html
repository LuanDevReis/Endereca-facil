<div class="app-shell">
  <app-sidebar [aberta]="menuAberto" (navegou)="fecharMenu()"></app-sidebar>
  <button *ngIf="menuAberto" class="sidebar-overlay" type="button" aria-label="Fechar menu" (click)="fecharMenu()"></button>
  <div class="app-content">
    <app-header [titulo]="tituloPagina" (menuToggle)="alternarMenu()"></app-header>
    <main class="page-content">
      <div class="container-fluid px-0"><router-outlet></router-outlet></div>
    </main>
  </div>
</div>
