<aside class="sidebar" [class.sidebar--open]="aberta" aria-label="Navegação principal">
  <div class="brand d-flex align-items-center gap-3">
    <span class="brand-mark"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i></span>
    <div><strong>Endereça Fácil</strong><small class="d-block">Cadastros com ViaCEP</small></div>
  </div>
  <nav class="nav flex-column gap-2 mt-4">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="navegou.emit()">
      <i class="bi bi-grid" aria-hidden="true"></i><span>Início</span>
    </a>
    <a routerLink="/cadastro" routerLinkActive="active" (click)="navegou.emit()">
      <i class="bi bi-person-plus" aria-hidden="true"></i><span>Novo cadastro</span>
    </a>
    <a routerLink="/cadastros" routerLinkActive="active" (click)="navegou.emit()">
      <i class="bi bi-people" aria-hidden="true"></i><span>Cadastros</span>
    </a>
  </nav>
  <p class="sidebar-note mt-auto mb-0"><i class="bi bi-info-circle me-2"></i>Dados mantidos apenas em memória.</p>
</aside>
